name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (shell + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck python3-gi gir1.2-gtk-3.0

      - name: ShellCheck
        run: shellcheck bin/brightness install.sh uninstall.sh

      - name: Syntaxe bash
        run: |
          bash -n bin/brightness
          bash -n install.sh
          bash -n uninstall.sh

      - name: Syntaxe Python
        run: python3 -m py_compile bin/brightness-gui
